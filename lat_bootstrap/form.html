<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Pendaftaran</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="index.html">Sistem Data Mahasiswa</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
          <li class="nav-item"><a class="nav-link" href="data.html">Data Mahasiswa</a></li>
          <li class="nav-item"><a class="nav-link active" href="form.html">Form Pendaftaran</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-5 mb-5">
    <h2 class="mb-4">Form Pendaftaran Mahasiswa</h2>

    <form>
      <!-- Textbox -->
      <div class="mb-3">
        <label for="nama" class="form-label">Nama Lengkap</label>
        <input type="text" class="form-control" id="nama" placeholder="Masukkan nama lengkap">
      </div>

      <div class="mb-3">
        <label for="nim" class="form-label">NIM</label>
        <input type="text" class="form-control" id="nim" placeholder="Masukkan NIM">
      </div>

      <!-- Dropdown -->
      <div class="mb-3">
        <label for="prodi" class="form-label">Program Studi</label>
        <select class="form-select" id="prodi">
          <option selected disabled>Pilih program studi</option>
          <option value="rpl">Rekayasa Perangkat Lunak</option>
          <option value="ti">Teknik Informatika</option>
          <option value="si">Sistem Informasi</option>
        </select>
      </div>

      <!-- Text Area -->
      <div class="mb-3">
        <label for="alamat" class="form-label">Alamat</label>
        <textarea class="form-control" id="alamat" rows="3" placeholder="Masukkan alamat lengkap"></textarea>
      </div>

      <!-- Radio Button -->
      <div class="mb-3">
        <label class="form-label d-block">Jenis Kelamin</label>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="gender" id="lakiLaki" value="L">
          <label class="form-check-label" for="lakiLaki">Laki-laki</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="gender" id="perempuan" value="P">
          <label class="form-check-label" for="perempuan">Perempuan</label>
        </div>
      </div>

      <!-- Checkbox -->
      <div class="mb-3">
        <label class="form-label d-block">Minat</label>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" id="minatWeb" value="web">
          <label class="form-check-label" for="minatWeb">Web Development</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" id="minatDb" value="database">
          <label class="form-check-label" for="minatDb">Database</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" id="minatOs" value="os">
          <label class="form-check-label" for="minatOs">Sistem Operasi</label>
        </div>
      </div>

      <button type="submit" class="btn btn-primary">Daftar</button>
      <a href="data.html" class="btn btn-secondary">Batal</a>
    </form>
  </div>

  <footer class="text-center text-muted mb-4">
    &copy; 2026 - Tugas Web Dasar
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
